default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-commit]
  - repo: local
    hooks:
      - id: cve-lite
        name: CVE Lite (Node dependency lockfiles)
        entry: bun run cve-lite . --fail-on high
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
