name: OSV-Scanner

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "12 12 * * 1"

permissions: {}

concurrency:
  group: osv-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan-scheduled:
    if: ${{ github.event_name == 'push' || github.event_name == 'schedule' }}
    permissions:
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: false
      upload-sarif: false

  scan-pr:
    if: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: read
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@32d3cd482bdadfb38b186c0ad1b031902d55d932 # v2.7.1
    with:
      fail-on-vuln: true
      upload-sarif: false
